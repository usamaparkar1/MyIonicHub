<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title color="primary">{{ 'ROUTE_NOT_FOUND.PAGE_NOT_FOUND' | translate }}</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">{{ 'ROUTE_NOT_FOUND.PAGE_NOT_FOUND' | translate }}</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-grid>
        <ion-row><ion-col class="rnf-img-col-container">
            <ion-img [src]="coreData.routeNotFoundSvgUrl"></ion-img>
        </ion-col></ion-row>

        <ion-row>
            <ion-col>
                <ion-title color="primary" class="rnf-title">{{ 'ROUTE_NOT_FOUND.TITLE' | translate }}</ion-title>
            </ion-col>
        </ion-row>

        <ion-row *ngFor="let card of cards"><ion-col>
            <ion-card class="cards">
                <!-- First Row: Icon -->
                <ion-row>
                    <ion-col size="12" class="ion-text-center">
                        <ion-icon color="primary" [name]="card.icon" size="large"></ion-icon>
                    </ion-col>
                </ion-row>
            
                <!-- Second Row: Title -->
                <ion-row>
                    <ion-col size="12" class="ion-text-center">
                        <ion-title class="rnf-route" (click)="changeRoute(card.title)" color="dark">{{card.title | titlecase}}</ion-title>
                    </ion-col>
                </ion-row>
            
                <!-- Third Row: Description -->
                <ion-row>
                    <ion-col size="12" class="ion-text-center">
                        <ion-text>{{card.description}}</ion-text>
                    </ion-col>
                </ion-row>
            </ion-card>
        </ion-col></ion-row>
    </ion-grid>  
</ion-content>
