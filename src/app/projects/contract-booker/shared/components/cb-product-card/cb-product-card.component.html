<ion-card>
    <ion-card-header>
        <ion-thumbnail>
            <img [src]="product.productImage ? product.productImage : contractBookerData.defaultProductImg" alt="Product Image" />
        </ion-thumbnail>
    </ion-card-header>
    <ion-card-content>
        <p>{{ product.name }}</p>
        <p>Price: {{ product.name }}</p>
    </ion-card-content>
</ion-card>
