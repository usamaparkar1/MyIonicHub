<ion-card>
    <ion-card-header>
        <ion-img
            [src]="product.productImage ? product.productImage : contractBookerData.defaultProductImg"
                alt="Product Image"
            ></ion-img>
    </ion-card-header>

    <ion-card-content>
        <p>{{ product.name }}</p>
        <p>{{ product.productPrice | currency:'EUR':'symbol':'1.2-2' }}</p>
    </ion-card-content>
</ion-card>
