<ion-header [translucent]="isTranslucent" [collapse]="collapseValue">
    <ion-toolbar color="cbprimary">
        <ion-buttons slot="start">
            <ion-button (click)="cbMenuClicked()">
                <ion-icon slot="icon-only" [src]="contractBookerData.menuSvgUrl"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ng-content select="[cb-header-1]"></ng-content>
        <ng-content select="[cb-header-2]"></ng-content>
        <div cb-header-3 slot="end" [hidden]="!isCartCountGreaterThanZero() || isSecondHeader">
            <ion-icon
                size="large"
                [src]="contractBookerData.shoppingCartSvgUrl"
                (click)="openShoppingCart()"
            ></ion-icon>
            <!-- Specify hidden here because badge position is absolute -->
            <ion-badge [hidden]="isSecondHeader" (click)="openShoppingCart()" class="cart-item-count">{{contracts.length}}</ion-badge>
        </div>
        <app-profile-header [hidden]="isSecondHeader" cb-header-4 slot="end"></app-profile-header>
    </ion-toolbar>
</ion-header>
