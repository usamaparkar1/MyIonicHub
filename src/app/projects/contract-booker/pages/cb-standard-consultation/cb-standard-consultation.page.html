<cb-header [isTranslucent]="true">
  <ion-title cb-header-1>{{ 'CB.PRODUCT_SELECTION.STANDARD_CONSULTATION' | translate }}</ion-title>
</cb-header>

<ion-content [fullscreen]="true" scrollY="true">
  <cb-header collapseValue="condense" [isSecondHeader]="true">
    <ion-title cb-header-1>{{'CB.PRODUCT_SELECTION.STANDARD_CONSULTATION' | translate}}</ion-title>
  </cb-header>

  @if (products.length > 0) {
    <ion-grid>
      <!-- List of available Products for each Sector -->
      <ion-row>
        @for (product of products; track product) {
          <ion-col [size]="getColumnClass()" class="product-container">
            <cb-product-card (click)="productClicked(product.productId, product.name)" [product]="product"></cb-product-card>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  }
</ion-content>

@if (selectedSector) {
  <ion-footer>
    <ion-toolbar>
      <ion-segment color="cbprimary" [value]="selectedSector.sectorId">
        @for (sector of sectors; track sector) {
          <ion-segment-button [value]="sector.sectorId" (click)="sectorClicked(sector)">
            <ion-label>{{sector.sectorName}}</ion-label>
            <ion-icon [src]="sector.sectorIcon"></ion-icon>
          </ion-segment-button>
        }
      </ion-segment>
    </ion-toolbar>
  </ion-footer>
}
