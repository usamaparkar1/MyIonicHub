<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Dashboard</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-grid>
        <ion-row><ion-col>
            <ion-card class="modern-card">
                <!-- Images -->
                <ion-row><ion-col>
                    <img alt="gas" src="assets/icon/contract-booker/gas.svg" />
                </ion-col>
                <ion-col>
                    <img alt="electricity" src="assets/icon/contract-booker/electricity.svg" />
                </ion-col></ion-row>
                <!-- App Title -->
                <ion-card-header>
                    <ion-card-title>Contract Booker</ion-card-title>
                </ion-card-header>
                <!-- App Description -->
                <ion-card-content>
                    This application lets you book electricity and gas contracts.
                </ion-card-content>
            </ion-card>
        </ion-col></ion-row>
    </ion-grid>
</ion-content>
