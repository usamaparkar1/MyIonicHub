name: Merge to Master

on:
  push:
    branches: 
        - develop

jobs:
  merge_to_master:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Create pull request from develop to master
      uses: peter-evans/create-pull-request@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        base: master
        branch: develop
        title: 'Merge develop into master'
        body: 'This pull request was automatically created when merging develop into master.'
