name: Push to main

on:
  push:
    branches:
      - develop

jobs:
  push_to_main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/checkout@v2   # Checkout develop branch again (avoid credential issues)
        with:
          ref: ${{ github.sha }}  # Use the pushed commit SHA
      - run: |
          git config --global user.email "your_github_email@example.com"
          git config --global user.name "GitHub Actions"
          git push origin ${{ github.sha }} main  # Push to main with PAT
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Personal Access Token with push access
