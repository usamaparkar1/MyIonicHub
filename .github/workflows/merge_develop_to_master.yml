name: Merge to Master

on:
  push:
    branches:
      - develop

permissions:
  actions: write
  checks: write
  pull-requests: write

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create pull request
        run: |
          gh_pr_up() { gh pr create $* || gh pr edit $*; }
          gh_pr_up --title "My pull request" --body "Description" --base master --head develop
        env:
          GITHUB_TOKEN: ${{ secrets.MERGE_WORKFLOW_ACCESS_TOKEN }}